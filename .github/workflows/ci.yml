name: CI

# Runs on every push and every pull request targeting main — catches
# problems before they get merged, not after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # JOB 1: Lint + Test
  # ============================================================
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the version used in Dockerfile (python:3.11-slim) so CI
          # tests the same runtime the app is actually deployed with —
          # not a different version that might behave subtly differently.
          python-version: "3.11"
          # Caches pip downloads between runs, keyed on requirements.txt.
          # This project's dependencies include torch and sentence-
          # transformers, which are large — caching meaningfully speeds up
          # every CI run after the first.
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run linter (ruff check)
        run: ruff check .

      - name: Run formatter check (ruff format --check)
        run: ruff format --check .

      - name: Run tests
        # No API keys are set here on purpose — the test suite is
        # specifically designed (see tests/README.md) to mock every real
        # external call (Gemini, embeddings), so it runs correctly without
        # live secrets. A failing test here means a real problem, not a
        # missing-secret problem.
        run: python -m pytest tests/ -v

  # ============================================================
  # JOB 2: Docker build verification
  # ============================================================
  docker-build:
    runs-on: ubuntu-latest
    # This is what makes "fail when tests fail" actually mean something:
    # the Docker build is gated on tests passing first, not run in
    # parallel — a broken test run blocks the whole pipeline, not just
    # its own step.
    needs: lint-and-test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Docker image
        # Build-only verification — no registry is configured yet (that's
        # a deployment concern, not a CI concern), so this step's whole
        # job is to catch a broken Dockerfile before it reaches anyone,
        # not to publish anything.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: clinical-rag-api:ci
          # Cache Docker layers between runs the same way pip caching
          # speeds up dependency installs above.
          cache-from: type=gha
          cache-to: type=gha,mode=max